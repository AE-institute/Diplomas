<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>برامج معهد التميز الامريكي العالي للتدريب</title>
    <meta property="og:title" content="برامج معهد التميز الامريكي العالي للتدريب">
    <meta property="og:description" content="اكتشف تفاصيل برامجنا التدريبية والدبلومات والمقررات المتاحة">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="برامج معهد التميز الامريكي العالي للتدريب">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1a4a76;
            --secondary-color: #3a82c4;
            --accent-color: #d4af37;
            --text-color: #2c3e50;
            --white-bg: rgba(255, 255, 255, 0.95);
        }

        body {
            font-family: 'Tajawal', Tahoma, Geneva, sans-serif;
            background: linear-gradient(135deg, #f4f7f6 0%, #e8f0fe 100%);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.8;
            min-height: 100vh;
        }

        header {
            background-color: var(--white-bg);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-align: center;
            padding: 15px 0;
            border-bottom: 4px solid var(--accent-color);
            position: relative;
            z-index: 100;
        }

        header img {
            max-width: 250px;
            width: 70%;
            height: auto;
        }

        .container {
            max-width: 1050px;
            margin: 30px auto;
            padding: 30px 20px;
            background-color: var(--white-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .selection-area {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 30px;
            border-bottom: 2px dashed rgba(58, 130, 196, 0.2);
            position: relative;
            z-index: 50;
        }

        .selection-area label {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary-color);
            margin-bottom: 15px;
            display: block;
        }

        select#diplomaSelect {
            width: 100%;
            max-width: 500px;
            height: 60px;
            padding: 0 15px;
            font-size: 1.2rem;
            font-family: 'Tajawal', sans-serif;
            border: 2px solid var(--secondary-color);
            border-radius: 12px;
            background-color: #ffffff;
            color: var(--primary-color);
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);

            -webkit-appearance: menulist;
            -moz-appearance: menulist;
            appearance: menulist;
        }

        select#diplomaSelect:focus {
            border-color: var(--accent-color);
            outline: none;
        }

        .details-section {
            display: none;
            animation: slideUp 0.5s ease forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2#diplomaTitle {
            color: var(--primary-color);
            font-size: 2rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 25px;
            position: relative;
            padding-bottom: 15px;
        }

        h2#diplomaTitle::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background-color: var(--accent-color);
            border-radius: 2px;
        }

        .info-card {
            background: #ffffff;
            border-right: 5px solid var(--secondary-color);
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .info-card h3 {
            color: var(--primary-color);
            font-size: 1.3rem;
            margin-top: 0;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-card h3::before {
            content: '📌';
            color: var(--accent-color);
        }

        .info-card p {
            text-align: justify;
            font-size: 1.1rem;
            color: #4a5568;
            margin: 0;
        }

        ul.objectives-list {
            list-style-type: none;
            padding-right: 0;
            margin: 0;
        }

        ul.objectives-list li {
            position: relative;
            padding-right: 30px;
            font-size: 1.1rem;
            color: #4a5568;
            background: #fdfdfd;
            padding: 10px 30px 10px 10px;
            border-radius: 8px;
            border: 1px solid #eef2f7;
            margin-bottom: 10px;
        }

        ul.objectives-list li::before {
            content: "✓";
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            background-color: var(--accent-color);
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .section-title {
            color: var(--primary-color);
            font-size: 1.6rem;
            margin: 30px 0 20px;
            text-align: right;
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 10px;
        }

        .levels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .level-card {
            background-color: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .level-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 12px 15px;
            font-size: 1.2rem;
            font-weight: 700;
            text-align: center;
        }

        .level-courses {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        .level-courses li {
            padding: 10px 15px;
            border-bottom: 1px solid #f1f5f9;
            color: #4a5568;
            font-size: 1.05rem;
            font-weight: 500;
            display: flex;
            align-items: center;
        }

        .level-courses li:last-child {
            border-bottom: none;
        }

        .level-courses li::before {
            content: "▪";
            color: var(--accent-color);
            font-size: 1.2rem;
            margin-left: 10px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px 15px;
                margin: 15px;
                border-radius: 12px;
            }

            select#diplomaSelect {
                height: 55px;
                font-size: 1.1rem;
            }
        }
    
        /* Contact Section Styles */
        .contact-section {
            margin-top: 50px;
            padding-top: 30px;
            border-top: 2px dashed rgba(58, 130, 196, 0.2);
            text-align: center;
        }

        .contact-title {
            color: var(--primary-color);
            font-size: 1.8rem;
            margin-bottom: 25px;
            font-weight: 800;
            display: inline-block;
            position: relative;
        }

        .contact-title::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 3px;
            background-color: var(--accent-color);
            border-radius: 2px;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            justify-content: center;
        }

        .contact-card {
            background: linear-gradient(135deg, #ffffff, #f8fbff);
            border: 1px solid #e2e8f0;
            border-bottom: 4px solid var(--accent-color);
            border-radius: 16px;
            padding: 25px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
        }

        .contact-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border-color: var(--secondary-color);
        }

        .contact-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        .contact-card h4 {
            color: var(--primary-color);
            font-size: 1.4rem;
            margin: 0 0 20px 0;
            font-weight: 800;
        }

        .contact-card a {
            display: block;
            color: var(--primary-color);
            font-size: 1.3rem;
            font-weight: 700;
            text-decoration: none;
            margin: 10px auto;
            transition: all 0.3s ease;
            background: rgba(58, 130, 196, 0.08);
            padding: 12px;
            border-radius: 10px;
            width: 80%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            direction: ltr;
        }

        .contact-card a::before {
            content: '📞';
            font-size: 1.2rem;
        }

        .contact-card a:hover {
            background: var(--primary-color);
            color: #ffffff;
            transform: scale(1.05);
        }

    </style>
</head>

        window.onload = function() {
            const selectElement = document.getElementById("diplomaSelect");
            for (let diplomaName in diplomasData) {
                let option = document.createElement("option");
                option.value = diplomaName;
                option.textContent = diplomaName;
                selectElement.appendChild(option);
            }
        };

        function showDiplomaDetails() {
            const selectedDiploma = document.getElementById("diplomaSelect").value;
            const detailsContainer = document.getElementById("detailsContainer");

            if (selectedDiploma === "") {
                detailsContainer.style.display = "none";
                return;
            }

            const info = diplomasData[selectedDiploma];
            const levels = levelsData[selectedDiploma];

            document.getElementById("diplomaTitle").textContent = "دبلوم " + selectedDiploma;
            document.getElementById("diplomaDescription").textContent = info.description;
            document.getElementById("diplomaGeneralObj").textContent = info.generalObjective;

            const objectivesList = document.getElementById("diplomaSpecificObjs");
            objectivesList.innerHTML = "";
            info.specificObjectives.forEach(obj => {
                let li = document.createElement("li");
                li.textContent = obj;
                objectivesList.appendChild(li);
            });

            const levelsGrid = document.getElementById("levelsGrid");
            levelsGrid.innerHTML = "";

            levels.forEach(levelData => {
                let card = document.createElement("div");
                card.className = "level-card";

                let header = document.createElement("div");
                header.className = "level-header";
                header.textContent = "المستوى " + levelData.level;
                card.appendChild(header);

                let ul = document.createElement("ul");
                ul.className = "level-courses";
                levelData.courses.forEach(course => {
                    let li = document.createElement("li");
                    li.textContent = course;
                    ul.appendChild(li);
                });

                card.appendChild(ul);
                levelsGrid.appendChild(card);
            });

            detailsContainer.style.display = "block";
        }
    </script>
